name: Build and Commit PDF

on:
  push:
    branches:
      - main
    paths:
      - '**/*.tex'
      - '**/*.bib'
      - '**/*.sty'
      - '**/*.cls'
      - '.latexmkrc'
      - 'latexmkrc'
      - '.github/workflows/build_publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cv-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_latex:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set reproducible PDF timestamp
        run: git show -s --format=%ct HEAD > .cv-build-epoch

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: Arash-Sarshar-CV.tex
          texlive_version: '2025'
          pre_compile: export SOURCE_DATE_EPOCH="$(cat .cv-build-epoch)"
          args: -pdf -g -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Commit and Push PDF
        run: |
          # Never publish an older build over a newer source commit.
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "Main has advanced; skipping this outdated build."
            exit 0
          fi

          git add -- Arash-Sarshar-CV.pdf
          if git diff --cached --quiet; then
            echo "PDF is unchanged; nothing to commit."
            exit 0
          fi

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions"
          git commit -m "Automated PDF update"
          git push origin HEAD:main
